name: Build macOS arm64 App

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHANNEL: oss

jobs:
  build_macos_arm64_app:
    name: Build macOS arm64 DMG
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: macos-aarch64-app
          is_self_hosted: false
          install_release_deps: true

      - name: Ensure Rust arm64 target is installed
        run: rustup target add aarch64-apple-darwin
        shell: bash

      - name: Check release app compile
        run: script/bundle --check-only --channel "$CHANNEL" --arch aarch64 --dmg-name-suffix arm64 --selfsign
        shell: bash

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.0.0
        with:
          go-version: stable

      - name: Install cargo-bundle
        run: script/install_cargo_bundle
        shell: bash

      - name: Install create-dmg
        run: brew install create-dmg
        shell: bash

      - name: Build app DMG
        id: bundle_app
        run: script/bundle --channel "$CHANNEL" --arch aarch64 --dmg-name-suffix arm64 --selfsign
        shell: bash

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-macos-arm64-dmg
          path: ${{ steps.bundle_app.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 7
